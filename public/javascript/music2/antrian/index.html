<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Queue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        font-family: "DM Sans", Arial, sans-serif;
        background: transparent;
        color: white;
      }

      #queueStack {
        position: fixed;
        right: 28px;
        top: 28px;
        z-index: 9999;
      }

      #queue-wrapper {
        position: relative;
        width: 340px;
      }

      #queue {
        position: relative;
        width: 100%;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
        transform-origin: bottom right;
        animation: queueAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        overflow: hidden;
        background: rgba(10, 10, 10, 0.8);
      }

      @keyframes queueAppear {
        from {
          opacity: 0;
          transform: scale(0.92) translateY(12px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      #queue-bg {
        position: absolute;
        inset: -20px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(1.5px);
        z-index: 0;
        transition:
          background-image 0.8s ease,
          opacity 0.8s ease;
        opacity: 0;
      }

      .queue-bg-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.1) 0%,
          rgba(0, 0, 0, 0.85) 50%,
          rgba(0, 0, 0, 0.95) 100%
        );
        z-index: 1;
      }

      #queue-content {
        position: relative;
        z-index: 2;
      }

      #dynamic-toast {
        position: absolute;
        top: -16px;
        left: -16px;
        z-index: 100;

        background: rgba(25, 25, 25, 0.65);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.6),
          inset 0 1px 2px rgba(255, 255, 255, 0.15);

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        overflow: hidden;
        white-space: nowrap;

        transition:
          max-width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          padding 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          border-radius 0.4s ease,
          height 0.4s ease;
      }

      .toast-idle {
        height: 38px;
        max-width: 120px;
        padding: 0 16px;
        border-radius: 20px;
      }

      .toast-active {
        height: 44px;
        max-width: 320px;
        padding: 0 18px;
        border-radius: 22px;
      }

      .toast-icon {
        font-size: 16px;
        flex-shrink: 0;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .toast-text {
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.95);
        transition:
          opacity 0.2s ease,
          transform 0.3s ease;
      }

      .queueHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .queueTitle {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.5px;
        color: rgba(255, 255, 255, 0.7);
        text-transform: uppercase;
      }
      .queueCount {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 500;
      }

      #queueList {
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 4px;
        max-height: 320px;
        overflow: hidden;
      }

      .queueItem {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
        opacity: 0;
        transform: translateY(-14px) scale(0.97);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease,
          background 0.2s ease;
        cursor: default;
      }
      .queueItem.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .queueItem.leave-up {
        opacity: 0;
        transform: translateY(-20px) scale(0.95);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }
      .queueItem.leave-delete {
        opacity: 0;
        transform: translateX(60px) scale(0.9);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        background: rgba(220, 60, 60, 0.1) !important;
      }
      .queueItem.enter-new {
        opacity: 0;
        transform: translateX(30px) scale(0.96);
      }

      .queueIndex {
        width: 20px;
        flex: 0 0 auto;
        font-size: 12px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.5);
        text-align: center;
      }
      .queueThumb {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        object-fit: cover;
        background: rgba(255, 255, 255, 0.05);
        flex: 0 0 auto;
      }
      .queueInfo {
        flex: 1;
        min-width: 0;
      }
      .queueSong {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .queueArtist {
        margin-top: 2px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .queueUser {
        margin-top: 4px;
        font-size: 11px;
        color: #1db954;
        font-weight: 600;
      }
      .queueDuration {
        flex: 0 0 auto;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 500;
      }
      .queueEmpty {
        text-align: center;
        padding: 20px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>

  <body>
    <div id="queueStack">
      <div id="queue-wrapper">
        <div id="dynamic-toast" class="toast-idle">
          <div class="toast-icon" id="toast-icon">💬</div>
          <div class="toast-text" id="toast-text">Ini Notif</div>
        </div>

        <div id="queue">
          <div id="queue-bg"></div>
          <div class="queue-bg-overlay"></div>

          <div id="queue-content">
            <div class="queueHeader">
              <div class="queueTitle">UP NEXT</div>
              <div id="queueCount" class="queueCount">0 Songs</div>
            </div>
            <div id="queueList"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="../../shared.js"></script>
    <script src="./appAntrean.js"></script>
  </body>
</html>
